name: Go Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go mod tidy
      - run: test -z "$(gofmt -s -l .)"
      - run: go vet ./...
      - run: go test -race ./...
